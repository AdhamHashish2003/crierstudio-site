<div id="consent-bar" class="consent" role="region" aria-label="{{a:consent.label}}" hidden>
<div class="in">
<p>{{t:consent.text}} <a href="{{=privacyHref}}#cookies">{{t:consent.more}}</a></p>
<div class="acts"><button type="button" data-consent="granted">{{t:consent.accept}}</button><button type="button" data-consent="denied">{{t:consent.decline}}</button></div>
</div>
</div>
<script>(function(){var K="crier_consent",b=document.getElementById("consent-bar");if(!b)return;function get(){try{return localStorage.getItem(K)}catch(e){return null}}function put(v){try{localStorage.setItem(K,v)}catch(e){}}function pad(){var v=b.hidden?"":b.offsetHeight+"px";document.body.style.paddingBottom=v;document.documentElement.style.scrollPaddingBottom=v}function show(f){b.hidden=false;pad();if(f){var x=b.querySelector("button");if(x)x.focus()}}function hide(){b.hidden=true;pad()}function wipe(){var h=location.hostname.split("."),d=h.slice(-2).join("."),c=document.cookie.split(";");for(var i=0;i<c.length;i++){var n=c[i].split("=")[0].trim();if(/^_ga/.test(n)){document.cookie=n+"=; Max-Age=0; path=/";document.cookie=n+"=; Max-Age=0; path=/; domain=."+d}}}b.addEventListener("click",function(e){var t=e.target.closest("[data-consent]");if(!t)return;var v=t.getAttribute("data-consent")==="granted"?"granted":"denied";put(v);if(typeof gtag==="function")gtag("consent","update",{analytics_storage:v});if(v==="denied")wipe();hide()});document.addEventListener("click",function(e){var t=e.target.closest&&e.target.closest('[data-consent-open],a[href$="#cookie-settings"]');if(!t)return;e.preventDefault();show(true)});window.addEventListener("resize",function(){if(!b.hidden)pad()});var s=get();if(s!=="granted"&&s!=="denied")show(false)})();</script>
