<main id="main-content">
    {{=crumbs}}
    <section class="phead" aria-labelledby="kit-title">
      <span class="eyebrow">{{t:kit.eyebrow}}</span>
      <h1 id="kit-title">{{t:kit.title}}</h1>
      <p class="lead">{{t:kit.lead}}</p>
      <div class="cta-row"><a class="btn" href="{{=signupHref}}">{{t:hero.start.btn}}</a><a class="btn ghost" href="{{=pricingHref}}">{{t:hero.start.pricing}}</a></div>
      <p class="fine">{{t:kit.portal}}</p>
    </section>

    <section id="inside" aria-labelledby="all-title">
      <div class="sec-head"><h2 id="all-title">{{t:kit.all.title}}</h2></div>
      {{=kitList}}
      <p class="fine" style="margin-top:16px">{{t:pkg.kit.note}}</p>
      <p class="more"><a href="{{=pricingHref}}">{{t:offer.plans}}</a></p>
    </section>

    <section id="how" aria-labelledby="how-title">
      <div class="sec-head"><h2 id="how-title">{{t:how.title}}</h2></div>
      <div class="flow" id="flow">{{=flow}}</div>
    </section>

    <section id="start" aria-labelledby="start-title">
      <div class="closing">
        <h2 id="start-title">{{t:hero.start.t}}</h2>
        <p class="lead">{{t:hero.start.x}}</p>
        <a class="btn" href="{{=signupHref}}">{{t:hero.start.btn}}</a>
      </div>
    </section>
  </main>
