<main id="main-content">
    {{>hero}}

    <section id="businesses" aria-labelledby="ind-title">
      <div class="sec-head"><h2 id="ind-title">{{t:ind.title}}</h2></div>
      <div class="inds">{{=inds}}</div>
    </section>

    <section id="seasons" aria-labelledby="seasons-title">
      <div class="sec-head">
        <h2 id="seasons-title">{{t:season.title}}</h2>
        <p class="lead">{{t:season.lead}}</p>
      </div>
      <div class="inds seasons">{{=seasons}}</div>
    </section>

    <section id="plans" aria-labelledby="plans-title">
      <div class="sec-head"><h2 id="plans-title">{{t:home.plans.title}}</h2></div>
      <div class="inds">{{=homePlans}}</div>
      <p class="more"><a href="{{=pricingHref}}">{{t:home.plans.more}}</a></p>
    </section>

    <section id="trust" aria-labelledby="trust-title">
      <div class="sec-head"><h2 id="trust-title">{{t:home.trust.title}}</h2></div>
      <div class="closing">
        {{=trust}}
        <p>{{t:home.contact}}</p>{{=waAbout}}
      </div>
    </section>
  </main>
