<main id="main-content">
    {{=crumbs}}
    <section class="phead prose" aria-labelledby="about-title">
      <span class="eyebrow">{{t:about.eyebrow}}</span>
      <h1 id="about-title">{{t:about.h1}}</h1>
      <p class="lead">{{t:about.lead}}</p>
    </section>
    <section class="prose" aria-labelledby="work-title">
      <h2 id="work-title">{{t:about.how.h}}</h2>
      <ul class="plain">
        <li>{{t:about.how.1}}</li>
        <li>{{t:about.how.2}}</li>
        <li>{{t:about.how.3}}</li>
        <li>{{t:about.how.4}}</li>
      </ul>
    </section>
    <section class="prose" aria-labelledby="contact-title">
      <h2 id="contact-title">{{t:about.contact.h}}</h2>
      <p>{{t:about.contact.p}}</p>{{=waAbout}}
      <p>{{t:about.co.p}}</p>
    </section>
    <section aria-labelledby="go-title">
      <div class="closing">
        <h2 id="go-title">{{t:about.go}}</h2>
        <a class="btn" href="{{=pricingHref}}">{{t:about.cta}}</a>
      </div>
    </section>
  </main>
