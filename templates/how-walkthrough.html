<section id="walkthrough" class="wt" aria-labelledby="wt-title">
  <div class="wt-head">
    <span class="eyebrow">{{t:wt.eye}}</span>
    <h2 id="wt-title">{{t:wt.h2}}</h2>
    <p class="lead">{{t:wt.sub}}</p>
  </div>
  <div class="wt-grid">
    <div class="wt-stage">
      {{=dash}}
    </div>
    <div class="wt-side">
      <div class="wt-progress" aria-hidden="true"><span class="wt-count"><bdi dir="ltr"><b>{{=wtTotal}}</b> / {{=wtTotal}}</bdi></span><span class="wt-track"><i></i></span></div>
      <ol class="wt-steps" aria-label="{{a:wt.steps}}">{{=wtSteps}}</ol>
      <div class="wt-detail">{{=wtDetails}}</div>
      <div class="wt-cta"><a class="btn wa-order" href="{{=lpWaHref}}" target="_blank" rel="noopener" data-wa="home_how">{{t:lp.cta}}</a><a class="wt-from" href="{{=pricingHref}}">{{t:wt.from}}</a></div>
    </div>
  </div>
</section>
