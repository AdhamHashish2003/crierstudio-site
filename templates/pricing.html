<main id="main-content">
    {{=crumbs}}
    <section class="phead" aria-labelledby="pricing-title">
      <span class="eyebrow">{{t:pricing.eyebrow}}</span>
      <h1 id="pricing-title">{{t:pricing.h1}}</h1>
      <p class="lead">{{t:pricing.lead}}</p>
      {{=curPick}}
    </section>

    <section id="plans" aria-labelledby="plans-title">
      <div class="sec-head"><h2 id="plans-title">{{t:pricing.plans.title}}</h2></div>
      <div class="plans four">{{=planCards}}</div>
    </section>

    <section id="billing" aria-labelledby="bill-title">
      <div class="sec-head"><h2 id="bill-title">{{t:bill.title}}</h2></div>
      <ul class="billing">{{=billItems}}</ul>
      <p class="more"><a href="{{=faqHref}}">{{t:faq.all}}</a></p>
    </section>

    <section id="one-time" aria-labelledby="one-title">
      <div class="sec-head"><h2 id="one-title">{{t:one.title}}</h2></div>
      <div class="plans single">{{=deckCards}}</div>
    </section>
  </main>
