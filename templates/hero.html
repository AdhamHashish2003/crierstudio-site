<!-- HERO BLOCK: one swappable block. Keep real HTML text (the H1 is the LCP element); a 3D layer may be added on top later, never replace the text. -->
<div class="hero" id="hero">
      <div class="hero-copy">
        <span class="eyebrow">{{t:hero.eyebrow}}</span>
        <h1><span>{{t:hero.h1a}}</span><span class="hl">{{t:hero.h1b}}</span></h1>
        <p class="lead">{{t:hero.sub}}</p>
        <div class="cta-row">
          <a class="btn" href="#get-snapshot">{{t:hero.cta}}</a>
          <a class="btn ghost" href="#how">{{t:hero.secondary}}</a>
        </div>
        <p class="fine">{{t:hero.fine}}</p>
      </div>
      <div class="board" role="img" aria-label="{{a:board.aria}}">
        <div class="tile t1"><span class="circ" aria-hidden="true"></span><span class="circ2" aria-hidden="true"></span><b>{{t:board.t1b}}</b><small>{{t:board.t1s}}</small><span class="ex">{{t:board.ex}}</span></div>
        <div class="side">
          <div class="tile t2"><span class="ex">{{t:board.ex}}</span></div>
          <div class="tile t3"><span class="ex">{{t:board.reel}}</span></div>
        </div>
        <div class="tile t4">
          <div class="row you"><span>{{t:board.you}}</span><div class="bar"><i style="width:58%"></i></div></div>
          <div class="row"><span>{{t:board.a}}</span><div class="bar"><i style="width:74%"></i></div></div>
          <div class="row"><span>{{t:board.b}}</span><div class="bar"><i style="width:46%"></i></div></div>
          <div class="row"><span>{{t:board.c}}</span><div class="bar"><i style="width:66%"></i></div></div>
          <span class="ex">{{t:board.exScore}}</span>
        </div>
      </div>
    </div>
