<!-- HERO BLOCK: one swappable block. Real HTML text (the H1 is the LCP element). The Deck (3D) is a progressive layer in .stage, loaded after first paint by site.js -> /assets/deck.js; the CSS cards are the static fallback. -->
<div class="hero" id="hero">
      <div class="hero-copy">
        <span class="eyebrow">{{t:hero.eyebrow}}</span>
        <h1><span>{{t:hero.h1a}}</span><span class="hl">{{t:hero.h1b}}</span></h1>
        <p class="lead">{{t:hero.sub}}</p>
        <div class="cta-row">
          <a class="btn" href="{{=pricingHref}}">{{t:hero.plans}}</a>
          <a class="btn ghost" href="{{=deckHref}}">{{t:nav.deck}}</a>
        </div>
        <p class="fine">{{t:hero.fine}}</p>
      </div>
      <div class="deck-stage" aria-hidden="true">
        <div class="fallback"><i class="fc"></i><i class="fc"></i><i class="fc"></i><i class="fc"></i></div>
        <canvas class="gl"></canvas>
      </div>
    </div>
