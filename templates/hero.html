<section class="st-hero" id="hero" aria-labelledby="home-title">
  <div class="st-hero-copy">
    <span class="eyebrow">{{t:home.eyebrow}}</span>
    <h1 id="home-title">{{=heroH1}}</h1>
    <p class="lead">{{t:home.lead}}</p>
    <div class="st-cta">
      {{=heroBtn}}
      <a class="st-link" href="#walkthrough">{{t:hero.more}}</a>
      <a class="st-link" href="#pricing">{{t:hero.start.pricing}}</a>
    </div>
  </div>
  {{=heroCards}}
</section>
